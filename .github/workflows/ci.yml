name: CI

# Every push and every PR gets checked. Only main gets published — the image that exists in
# the registry should be one that passed, so `publish` waits on `check` rather than running
# beside it.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # `npm test` builds first — one test drives the real static server against dist/, so
      # the build is covered here rather than needing a step of its own.
      - name: Test
        run: npm test

  publish:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # Required for the layer cache below. The default `docker` driver cannot export build
      # cache at all — that is the "cache export is not supported" failure — so the build
      # needs the docker-container driver, which this sets up.
      - uses: docker/setup-buildx-action@v4

      # The built-in token is enough to publish. A classic PAT is only needed by whatever
      # *pulls* the image, and only if the package is private.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` is what the box follows; the sha tag is what a rollback pins to.
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The browser's PostHog key, which Vite can only inline while the image is being
          # built. A repository *variable* rather than a secret on purpose: this key is
          # write-only and ships to every player anyway, and a secret here would be masked
          # out of the logs while sitting in plain sight in the bundle — security theatre
          # that makes a mistyped key harder to diagnose. The personal key that reads the
          # project is not here at all; it is runtime config on the box, see compose.prod.yaml.
          # Both unset simply build a game with analytics off.
          build-args: |
            VITE_POSTHOG_KEY=${{ vars.VITE_POSTHOG_KEY }}
            VITE_POSTHOG_HOST=${{ vars.VITE_POSTHOG_HOST }}
          # The Dockerfile's install layer is keyed on the lockfile, so this skips `npm ci`
          # entirely on any build where dependencies did not move.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Runs on the box itself. The runner dials out to GitHub, so the tunnel stays
  # outbound-only — there is no inbound route into the LAN and no SSH key or Access token
  # sitting in this repository's secrets.
  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted

    # Two deploys at once would race on the same containers and the same volume.
    concurrency:
      group: deploy
      cancel-in-progress: false

    steps:
      # The compose file and the deploy script come from the checkout, so the box never
      # holds a copy of either that can drift from what is in the repository.
      - uses: actions/checkout@v7

      - run: ./deploy/deploy.sh
