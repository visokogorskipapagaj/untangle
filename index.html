<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Untangle</title>
</head>
<body>
  <!--
    The whole page, now that every piece of the interface is a component that carries its own
    markup: the playfield, the canvas the renderer draws on, and one tag per region.

    Order is paint order. The HUD and the chain meter sit over the board; the five overlays
    sit over both, and only one of them is ever up. The title screen is the exception that
    starts visible, because it is where a run begins.
  -->
  <div id="stage">
    <canvas id="canvas"></canvas>

    <u-hud></u-hud>
    <u-chain-meter></u-chain-meter>

    <u-title-screen></u-title-screen>
    <u-interlude hidden></u-interlude>
    <u-briefing hidden></u-briefing>
    <u-game-over hidden></u-game-over>
    <u-settings hidden></u-settings>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
