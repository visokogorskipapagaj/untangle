<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Untangle</title>
  <!--
    Two crossing strands in the game's own accent and bank colours, inlined rather than
    shipped as a file: it costs one line here instead of a `public/` directory, a build
    path and the round trip the browser would otherwise make for it.
  -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2032%2032'%3E%3Crect%20width%3D'32'%20height%3D'32'%20rx%3D'7'%20fill%3D'%230a0d13'%2F%3E%3Cpath%20d%3D'M7%208c10%200%208%2016%2018%2016'%20fill%3D'none'%20stroke%3D'%238ab4ff'%20stroke-width%3D'3.5'%20stroke-linecap%3D'round'%2F%3E%3Cpath%20d%3D'M7%2024c10%200%208-16%2018-16'%20fill%3D'none'%20stroke%3D'%235ee6a8'%20stroke-width%3D'3.5'%20stroke-linecap%3D'round'%2F%3E%3C%2Fsvg%3E">
</head>
<body>
  <!--
    The whole page, now that every piece of the interface is a component that carries its own
    markup: the playfield, the canvas the renderer draws on, and one tag per region.

    Order is paint order. The HUD and the chain meter sit over the board; the five overlays
    sit over both, and only one of them is ever up. The title screen is the exception that
    starts visible, because it is where a run begins.
  -->
  <div id="stage">
    <canvas id="canvas"></canvas>

    <u-hud></u-hud>
    <u-chain-meter></u-chain-meter>

    <u-title-screen></u-title-screen>
    <u-interlude hidden></u-interlude>
    <u-briefing hidden></u-briefing>
    <u-game-over hidden></u-game-over>
    <u-settings hidden></u-settings>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
